name: PhiARK React Showcase / GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'starter-guides/**'
      - 'catalog/sources.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'starter-guides/**'
      - 'catalog/sources.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phiark-pages
  cancel-in-progress: false

jobs:
  build:
    name: Compile and verify React bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build-time dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Unit tests
        working-directory: site
        run: npm test
      - name: Compile GitHub Pages release
        working-directory: site
        run: npm run build
      - name: Prove local runtime asset paths
        working-directory: site
        run: npm run check:build
      - name: Upload built site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: phiark-react-site
          path: site/dist/
          if-no-files-found: error

  deploy:
    name: Publish React GitPage
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phiark-react-site
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
