name: PhiARK offline vault checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependency-free regression tests
        run: npm test
      - name: Seed and verify actual local guide bytes
        run: |
          npm run seed
          npm run vault -- verify
          npm run vault -- status
      - name: Local HTTP smoke test (no external connections)
        run: |
          node src/server.mjs > /tmp/phiark-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node -e "const go=async()=>{for(let i=0;i<30;i++){try{const r=await fetch('http://127.0.0.1:3691/api/status');if(r.ok){const j=await r.json();if(j.documents!==2||j.networkRequired!==false)throw Error('unexpected status');const docs=await(await fetch('http://127.0.0.1:3691/api/search?q=verification')).json();if(!docs.length)throw Error('missing starter guide');console.log('Local HTTP PASS; seeded files:',j.documents);return}}catch(e){if(i===29)throw e;await new Promise(res=>setTimeout(res,200))}}};go().catch(e=>{console.error(e);process.exitCode=1})"
