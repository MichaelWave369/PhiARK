name: PhiARK offline vault checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependency-free regression tests
        run: npm test
      - name: Seed and verify actual local guide bytes
        run: |
          npm run seed
          npm run vault -- verify
          npm run vault -- status
      - name: R0.3 knowledge-pack plan and portable roundtrip
        run: |
          npm run packs -- list
          npm run packs -- plan essential-field-r01
          DIGEST=$(node -e "import('./src/vault.mjs').then(async ({readCatalog})=>console.log((await readCatalog()).find(x=>x.title==='Emergency Information Plan').id))")
          npm run packs -- bind essential-field-r01 readiness-plan "$DIGEST"
          npm run packs -- export essential-field-r01 "$RUNNER_TEMP/phiark-ci-snapshot"
          npm run packs -- verify "$RUNNER_TEMP/phiark-ci-snapshot"
          npm run packs -- restore "$RUNNER_TEMP/phiark-ci-snapshot" "$RUNNER_TEMP/phiark-ci-restored" --i-approve-new-vault
          PHIARK_DATA_DIR="$RUNNER_TEMP/phiark-ci-restored" npm run vault -- verify
      - name: R0.4 offline Kiwix inventory checks
        run: |
          npm run kiwix -- list
          npm run kiwix -- inventory
      - name: R0.5 dry-run reader CLI contract
        run: |
          npm run reader -- help
          npm run reader -- inventory
      - name: Local HTTP smoke test (no external connections)
        run: |
          node src/server.mjs > /tmp/phiark-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node -e "const go=async()=>{for(let i=0;i<30;i++){try{const r=await fetch('http://127.0.0.1:3691/api/status');if(r.ok){const j=await r.json();if(j.documents!==2||j.networkRequired!==false)throw Error('unexpected status');const docs=await(await fetch('http://127.0.0.1:3691/api/search?q=verification')).json();if(!docs.length)throw Error('missing starter guide');const kiwix=await(await fetch('http://127.0.0.1:3691/api/kiwix')).json();if(kiwix.rows.length!==6||kiwix.rows.some(x=>x.status!=='NOT_INSTALLED'))throw Error('incorrect real archive inventory');console.log('Local HTTP PASS; seeded files:',j.documents);return}}catch(e){if(i===29)throw e;await new Promise(res=>setTimeout(res,200))}}};go().catch(e=>{console.error(e);process.exitCode=1})"
